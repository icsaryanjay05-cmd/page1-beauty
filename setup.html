<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAGE.1 API Setup</title>
<style>
body{font-family:Arial,sans-serif;background:#E9E2D0;color:#1D1D1B;margin:0;padding:30px}
.card{max-width:720px;margin:auto;background:#FCFAF6;border:1px solid #D6C9BD;border-radius:18px;padding:24px}
img{width:220px;max-width:70%;display:block;margin:0 auto 24px}
label{display:block;font-size:12px;font-weight:800;margin:16px 0 6px}
input{width:100%;box-sizing:border-box;height:46px;border:1px solid #CABAAD;border-radius:10px;padding:10px}
button{margin-top:12px;border:0;border-radius:10px;padding:13px 18px;background:#1D1D1B;color:#E9E2D0;font-weight:800;cursor:pointer}
pre{white-space:pre-wrap;background:#F4EEE4;padding:14px;border-radius:10px;min-height:60px}
.small{font-size:12px;color:#756E65;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <img src="./assets/images/page1-logo.png" alt="PAGE.1">
  <h1>Standalone API Setup</h1>
  <p class="small">For production, edit <b>assets/js/config.js</b>. This page is useful for testing: it can temporarily save the API URL in this browser.</p>
  <label>Apps Script Web App /exec URL</label>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="save()">Save in this Browser</button>
  <button onclick="test()">Test API</button>
  <pre id="result">Waiting...</pre>
</div>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/api.js"></script>
<script>
url.value=localStorage.getItem("PAGE1_API_URL")||(
  window.PAGE1_CONFIG&&!PAGE1_CONFIG.API_URL.includes("PASTE_YOUR_")
    ? PAGE1_CONFIG.API_URL
    : ""
);

function save(){
  PAGE1_API.setUrl(url.value.trim());
  result.textContent="Saved for this browser.";
}

function test(){
  PAGE1_API.setUrl(url.value.trim());
  result.textContent="Testing...";
  PAGE1_API.call("publicWebsiteInit",[])
    .then(data=>{
      result.textContent=
        "SUCCESS\nServices: "+(data.services||[]).length+
        "\nStaff: "+(data.staff||[]).length;
    })
    .catch(e=>{
      result.textContent="ERROR\n"+e.message;
    });
}
</script>
</body>
</html>
